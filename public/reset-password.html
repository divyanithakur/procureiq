<title>Password reset — ProcureIQ</title>

<style>
body{margin:0;background:#f7f9fc;color:#172b45;font-family:Inter,system-ui,sans-serif}.reset-page{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}.reset-card{width:min(430px,100%);box-sizing:border-box;background:#fff;border:1px solid #e2e8ef;border-radius:16px;padding:34px;box-shadow:0 20px 60px rgba(23,43,69,.08);text-align:center}.reset-brand{display:flex;justify-content:center;margin-bottom:22px}.reset-brand img{width:150px}.reset-kicker{font-size:10px;letter-spacing:.14em;font-weight:800;color:#245dcc}.reset-card h1{margin:9px 0 8px;font-size:28px;line-height:1.15;letter-spacing:-.035em}.reset-card p{margin:0 auto;color:#68798d;font-size:13px;line-height:1.6;max-width:340px}.reset-button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:13px 16px;background:#245dcc;color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}.reset-back{display:block;margin-top:18px;color:#245dcc;text-decoration:none;font-size:12px;font-weight:700}

</head><body><main class="reset-page"><section class="reset-card"><div class="reset-brand"><img src="/logo-dark.svg" alt="ProcureIQ"></div><div class="reset-kicker">ACCOUNT RECOVERY</div><h1>Continue with Clerk</h1><p>Your password reset is managed by Clerk's secure authentication flow. Open sign in and use <strong>Forgot password?</strong> to finish the reset.</p><button class="reset-button" id="openClerkReset" type="button">Open password recovery</button><a class="reset-back" href="/">← Back to ProcureIQ</a></section></main><script src="/auth.js?v=145"></script><script>window.procureIQAuthReady?.then(()=>{document.getElementById("openClerkReset")?.addEventListener("click",()=>window.procureIQOpenForgotPassword?.());}).catch(()=>{});</script></body></html>
