<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f9fc">
<title>Password recovery — ProcureIQ</title>
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg">
<link rel="stylesheet" href="/style.css?v=145">
<style>
body{margin:0;background:#f7f9fc;color:#172b45;font-family:Inter,system-ui,sans-serif}
.recovery-page{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}
.recovery-card{width:min(430px,100%);box-sizing:border-box;background:#fff;border:1px solid #e2e8ef;border-radius:16px;padding:34px;box-shadow:0 20px 60px rgba(23,43,69,.08);text-align:center}
.recovery-brand{display:flex;justify-content:center;margin-bottom:22px}.recovery-brand img{width:150px;height:auto}
.recovery-kicker{font-size:10px;letter-spacing:.14em;font-weight:800;color:#245dcc}
.recovery-card h1{margin:9px 0 8px;font-size:28px;line-height:1.15;letter-spacing:-.035em}.recovery-card p{margin:0 auto;color:#68798d;font-size:13px;line-height:1.6;max-width:340px}
.recovery-button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:13px 16px;background:#245dcc;color:#fff;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}.recovery-back{display:block;margin-top:18px;color:#245dcc;text-decoration:none;font-size:12px;font-weight:700}
</style>
</head>
<body>
<main class="recovery-page"><section class="recovery-card" aria-labelledby="recoveryTitle">
<div class="recovery-brand"><img src="/logo-dark.svg" alt="ProcureIQ"></div>
<div class="recovery-kicker">ACCOUNT RECOVERY</div>
<h1 id="recoveryTitle">Reset your password</h1>
<p>Password recovery is securely handled by Clerk. Continue to the standard ProcureIQ sign-in flow and choose <strong>Forgot password?</strong>.</p>
<button class="recovery-button" id="continueRecovery" type="button">Continue to password recovery</button>
<a class="recovery-back" href="/">← Back to ProcureIQ</a>
</section></main>
<script src="/auth.js?v=145"></script>
<script>
window.procureIQAuthReady?.then(() => {
  document.getElementById("continueRecovery")?.addEventListener("click", () => window.procureIQOpenForgotPassword?.());
  window.procureIQOpenForgotPassword?.();
}).catch(() => {});
</script>
</body></html>
